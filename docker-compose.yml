version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: idp-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: idppassword
      POSTGRES_DB: idp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
